<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NOVA — Discover premium products. Shop electronics, fashion, accessories and more." />
    <title>NOVA — Premium Shopping</title>
  </head>
  <body>
    <!-- Inline script: set theme class before any render to avoid flash -->
    <script>
      (function() {
        var t = localStorage.getItem('lavstore_theme') || 'dark';
        if (t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
